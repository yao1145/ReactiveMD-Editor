name: Publish npm package

# Manual publish flow for reactive-md-editor using npm trusted publishing
# (OIDC). Configure a NEW trusted publisher for this repository and workflow on
# npm; the engine's reactive-md trusted publisher does not cover this package.
# Publish the pinned engine before a new editor version. Use dist_tag=latest
# for stable releases and next for candidate trials. If the version is already on the registry, the
# workflow skips the publish step and still applies the requested dist-tags.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to publish
        required: true
        default: main
      dist_tag:
        description: npm dist-tag (latest for stable releases, next for candidate trials)
        required: true
        default: next
        type: choice
        options:
          - next
          - latest
      update_latest:
        description: Also move latest to this version; keep false for candidate trials
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: editor-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node and the npm registry
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Upgrade npm for OIDC publishing and dist-tag updates
        run: npm install -g 'npm@^11.21.0'

      - name: Install dependencies
        run: npm ci

      - name: Read the package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Target: reactive-md-editor@$version"

      - name: Check whether the version is already published
        id: registry
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "reactive-md-editor@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "reactive-md-editor@$VERSION already exists; skipping publish and updating tags only"
            npm view "reactive-md-editor@$VERSION" version dist.integrity dist.tarball --json
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the pinned engine release and tarball integrity
        if: steps.registry.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          engine_version=$(node -p "require('reactive-md/package.json').version")
          lock_integrity=$(node -e '
            const path = require("./package.json").devDependencies["reactive-md"];
            const candidate = require("./package-lock.json").packages["node_modules/reactive-md"];
            if (!path?.startsWith("file:vendor/") || candidate?.resolved !== path ||
                candidate.version !== process.argv[1] || !candidate.integrity) {
              throw new Error("The installed engine, vendor path and lockfile must identify the same tarball.");
            }
            process.stdout.write(candidate.integrity);
          ' "$engine_version")
          if ! registry_integrity=$(npm view "reactive-md@$engine_version" dist.integrity --prefer-online); then
            echo "Could not verify reactive-md@$engine_version on npm. Publish the engine first and retry." >&2
            exit 1
          fi
          if [ "$registry_integrity" != "$lock_integrity" ]; then
            echo "The lockfile candidate integrity does not match the published reactive-md@$engine_version artifact" >&2
            echo "Re-vendor the registry tarball and refresh package-lock.json before publishing." >&2
            exit 1
          fi
          echo "Verified reactive-md@$engine_version candidate integrity against npm"
          npm view "reactive-md@$engine_version" version dist.integrity --json

      - name: Typecheck, test, and build
        if: steps.registry.outputs.published != 'true'
        run: npm run check

      - name: Refresh and verify third-party notices
        if: steps.registry.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md

      - name: Pack the release tarball
        if: steps.registry.outputs.published != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-package
          npm pack --ignore-scripts --pack-destination artifacts/release-package
          tarball="artifacts/release-package/reactive-md-editor-$VERSION.tgz"
          test -f "$tarball"
          sha256sum "$tarball"

      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          npm publish "artifacts/release-package/reactive-md-editor-$VERSION.tgz" \
            --access public --tag "$DIST_TAG" --ignore-scripts

      - name: Update the requested tag for an existing version
        if: steps.registry.outputs.published == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: npm dist-tag add "reactive-md-editor@$VERSION" "$DIST_TAG"

      - name: Move latest when requested
        if: inputs.update_latest && inputs.dist_tag != 'latest'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm dist-tag add "reactive-md-editor@$VERSION" latest

      - name: Confirm the published package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if npm view "reactive-md-editor@$VERSION" version dist.integrity dist.tarball --json --prefer-online --fetch-retries=0 --fetch-timeout=15000; then
              npm view reactive-md-editor dist-tags --json --prefer-online
              exit 0
            fi
            echo "Waiting for npm processing ($attempt/30)"
            sleep 10
          done
          echo "npm accepted the upload but the version is still unavailable; inspect registry processing before retrying publication" >&2
          exit 1
